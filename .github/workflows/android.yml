name: 安卓构建

on:
  push:
    branches: [main]
    paths:
      - "client/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: HX-AIOA-${{ github.run_number }}.apk

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64, 配置方法见 docs/android-signing.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: 编译 Release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/${{ env.APK_NAME }}

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" "$RUNNER_TEMP/$APK_NAME" \
            --target "${{ github.sha }}" \
            --title "安卓 #${{ github.run_number }}" \
            --notes "提交 ${{ github.sha }}" \
            --latest
