name: 安卓构建

on:
  push:
    branches: [main]
    paths:
      - "client/android/**"
      - "tools/release.py"
      - ".github/workflows/android.yml"
  # PR 只编译并上传 APK 产物, 不发布
  pull_request:
    paths:
      - "client/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.run_number }}
  TAG: android-${{ github.run_number }}
  MIHOMO_VERSION: v1.19.34
  # 为最近几个版本生成增量补丁, 更旧的版本走完整包
  PATCH_FROM_COUNT: 3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要看到上一个发布标签以来的提交
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 组件库令牌来自锁定版本的 HX-UI (design/hx-ui.lock.json), 生成物必须是最新的
      - name: 核对 HX-UI 令牌
        run: node tools/hx-ui-gen.mjs --check

      - name: 下载代理内核
        run: |
          dir=client/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dir"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/$MIHOMO_VERSION/mihomo-android-arm64-v8-$MIHOMO_VERSION.gz" \
            | gunzip > "$dir/libmihomo.so"
          chmod +x "$dir/libmihomo.so"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64, 配置方法见 docs/deploy/android/signing.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: 单元测试
        working-directory: client/android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 编译 Release
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收集安装包
        run: |
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/out"
          cp client/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/HX-AIOA-$VERSION.apk"

      - name: 下载旧版本用于增量补丁
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/old.args"
          for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep '^android-' | head -n "$PATCH_FROM_COUNT"); do
            v="${tag#android-}"
            if gh release download "$tag" --pattern "HX-AIOA-$v.apk" --dir "$RUNNER_TEMP/old"; then
              echo "--old $v=$RUNNER_TEMP/old/HX-AIOA-$v.apk" >> "$RUNNER_TEMP/old.args"
            fi
          done

      - name: 生成更新说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep '^android-' | head -n 1 || true)
          if [ -n "$prev" ] && ! git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            git fetch --quiet origin "refs/tags/$prev:refs/tags/$prev" || prev=""
          fi
          python tools/release_notes.py --since "$prev" --out "$RUNNER_TEMP/changes.json" | tee "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || git log -1 --pretty='- %s' > "$RUNNER_TEMP/notes.md"

      - name: 生成补丁与 update.json
        if: github.event_name != 'pull_request'
        run: |
          pip install --quiet bsdiff4
          python tools/release.py \
            --apk "$RUNNER_TEMP/out/HX-AIOA-$VERSION.apk" \
            --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            --out "$RUNNER_TEMP/out" \
            --notes "$(git log -1 --pretty=%s)" \
            --changes "$RUNNER_TEMP/changes.json" \
            $(cat "$RUNNER_TEMP/old.args")

      - uses: actions/upload-artifact@v4
        with:
          name: HX-AIOA-${{ github.run_number }}
          path: ${{ runner.temp }}/out/

      - name: 发布到 Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/out/* \
            --target "${{ github.sha }}" \
            --title "安卓 #$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

  # 组件截图: 桌面目标渲染, 不需要安卓 SDK; PR 中先用目标分支录基线, 再对比本分支, 差异图作为产物
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: 录制基线 (目标分支)
        if: github.event_name == 'pull_request'
        working-directory: client/android
        run: |
          git checkout --quiet "origin/${{ github.base_ref }}"
          if [ -f ui/src/desktopTest/kotlin/com/hengxin/aioa/kit/KitScreenshotTest.kt ]; then
            gradle :ui:recordRoborazziDesktop -PdesktopOnly=true --no-daemon || true
          fi
          git checkout --quiet "${{ github.sha }}"

      - name: 截图与对比
        working-directory: client/android
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -d ui/build/outputs/roborazzi ]; then
            gradle :ui:compareRoborazziDesktop -PdesktopOnly=true --no-daemon
          else
            gradle :ui:recordRoborazziDesktop -PdesktopOnly=true --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: client/android/ui/build/outputs/roborazzi/
