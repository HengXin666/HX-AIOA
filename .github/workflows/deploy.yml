name: 服务端部署

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        working-directory: .
        run: npm ci

      - name: 类型检查
        working-directory: .
        run: npm run typecheck

      - name: 检查部署凭据
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN, 配置方法见 docs/deploy/cloudflare.md"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 CLOUDFLARE_ACCOUNT_ID, 配置方法见 docs/deploy/cloudflare.md"
            exit 1
          fi

      - name: 复制探针脚本到静态资源
        run: |
          cp ../tools/probe.mjs ../tools/probe-term.mjs public/
          # Agent 命令行也随服务端发一份: <服务地址>/hxaioa.mjs
          npx esbuild ../cli/src/main.mjs --bundle --platform=node --format=esm --target=node22 --outfile=public/hxaioa.mjs

      # Web 端 (#155): 与 Worker 同源部署, 页面与静态资源请求不进 Worker, 不计额度
      - name: 构建 Web 端到静态资源
        working-directory: .
        run: |
          npm run build -w client/web
          for f in client/web/dist/*; do
            n=$(basename "$f")
            if [ -e "server/public/$n" ]; then
              echo "::error::Web 构建产物 $n 与 server/public 里已有的文件重名"
              exit 1
            fi
          done
          cp -r client/web/dist/. server/public/

      # 文件桶 (#45): 没有就建; 部署 token 没有 R2 权限建不了时去掉绑定照常部署, 文件接口返回 503
      - name: 确保 R2 文件桶
        run: |
          BUCKET=hx-aioa-files
          if npx wrangler r2 bucket info "$BUCKET" >/dev/null 2>&1 || npx wrangler r2 bucket create "$BUCKET"; then
            echo "R2 桶 $BUCKET 就绪"
          else
            echo "::warning::建不了 R2 桶 $BUCKET (部署 token 需要 Workers R2 Storage 编辑权限), 本次部署不绑定文件桶"
            python3 - <<'PY'
          import re
          p = "wrangler.toml"
          s = open(p).read()
          open(p, "w").write(re.sub(r"\[\[r2_buckets\]\]\nbinding = \"FILES\"\nbucket_name = \"[^\"]+\"\n", "", s))
          PY
          fi

      - name: 核对环境变量总表
        working-directory: .
        run: python3 .github/scripts/env_doc_check.py

      - name: 部署到 Cloudflare
        run: npx wrangler deploy

      # 可选: 配置了 CF_ANALYTICS_TOKEN (只读 Account Analytics) 时启用 CF 额度页
      - name: 同步 CF 额度查询凭据
        env:
          AIOA_CF_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$AIOA_CF_TOKEN" ]; then
            echo "未配置 CF_ANALYTICS_TOKEN secret, 跳过, CF 额度页显示未配置"
            exit 0
          fi
          printf '%s' "$AIOA_CF_TOKEN" | npx wrangler secret put CF_API_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CF_ACCOUNT_ID

      # 可选: 配置了 CFD_TOKEN (HX-CF-Drive 受限令牌, 根目录 /aioa) 时同步, 大文件才能走 TG; 不配时存储设置里选不了 cfd
      - name: 同步 HX-CF-Drive 令牌
        env:
          AIOA_CFD_TOKEN: ${{ secrets.CFD_TOKEN }}
        run: |
          if [ -z "$AIOA_CFD_TOKEN" ]; then
            echo "未配置 CFD_TOKEN secret, 跳过, 文件只走 R2"
            exit 0
          fi
          printf '%s' "$AIOA_CFD_TOKEN" | npx wrangler secret put CFD_TOKEN

      # 可选: 配置了 CFD_DRIVE_TOKEN (Drive 整盘令牌, 根目录 /) 时同步, 网盘 (#154) 才能看整个盘; 不配时网盘只看 /aioa
      - name: 同步网盘 Drive 令牌
        env:
          AIOA_CFD_DRIVE_TOKEN: ${{ secrets.CFD_DRIVE_TOKEN }}
        run: |
          if [ -z "$AIOA_CFD_DRIVE_TOKEN" ]; then
            echo "未配置 CFD_DRIVE_TOKEN secret, 跳过, 网盘退回 CFD_TOKEN 只看 /aioa"
            exit 0
          fi
          printf '%s' "$AIOA_CFD_DRIVE_TOKEN" | npx wrangler secret put CFD_DRIVE_TOKEN

      # 可选: 仅当配置了 AUTH_TOKEN secret 时, 才同步 Worker 运行时密钥 (if 中不能引用 secrets, 改在脚本里判断)
      - name: 同步运行时密钥
        env:
          AIOA_AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          if [ -z "$AIOA_AUTH_TOKEN" ]; then
            echo "未配置 AUTH_TOKEN secret, 跳过运行时密钥同步"
            exit 0
          fi
          printf '%s' "$AIOA_AUTH_TOKEN" | npx wrangler secret put AUTH_TOKEN

      # 可选: 配置了 TOKEN_SECRET secret 时同步到 Worker, webhook 签名密钥由它派生
      - name: 同步 webhook 签名根密钥
        env:
          AIOA_TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: |
          if [ -z "$AIOA_TOKEN_SECRET" ]; then
            echo "未配置 TOKEN_SECRET secret, 跳过, GitHub webhook 验签不可用"
            exit 0
          fi
          printf '%s' "$AIOA_TOKEN_SECRET" | npx wrangler secret put TOKEN_SECRET

      # 可选: 配置了 AIOA_GITHUB_TOKEN secret 时同步为 Worker 的 GITHUB_TOKEN, 用于 GitHub 页面回填
      - name: 同步 GitHub 只读令牌
        env:
          AIOA_GITHUB_TOKEN: ${{ secrets.AIOA_GITHUB_TOKEN }}
        run: |
          if [ -z "$AIOA_GITHUB_TOKEN" ]; then
            echo "未配置 AIOA_GITHUB_TOKEN secret, 跳过, GitHub 页面只靠 webhook 更新"
            exit 0
          fi
          printf '%s' "$AIOA_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN

      # gh 插件设备码授权: 仓库变量 AIOA_GH_CLIENT_ID 和 secret AIOA_GH_CLIENT_SECRET 必须一起配 (令牌 8 小时过期, 没 secret 续不了), 见 docs/deploy/env.md
      - name: 同步 GitHub 设备码凭据
        env:
          AIOA_GH_CLIENT_ID: ${{ vars.AIOA_GH_CLIENT_ID }}
          AIOA_GH_CLIENT_SECRET: ${{ secrets.AIOA_GH_CLIENT_SECRET }}
        run: |
          if [ -z "$AIOA_GH_CLIENT_ID" ] && [ -z "$AIOA_GH_CLIENT_SECRET" ]; then
            echo "未配置 GitHub 设备码凭据, 跳过, gh 插件只能粘贴令牌授权"
            exit 0
          fi
          if [ -z "$AIOA_GH_CLIENT_ID" ] || [ -z "$AIOA_GH_CLIENT_SECRET" ]; then
            echo "::error::AIOA_GH_CLIENT_ID (variable) 和 AIOA_GH_CLIENT_SECRET (secret) 必须一起配, 只配一个授权 8 小时后就失效。见 docs/deploy/env.md"
            exit 1
          fi
          printf '%s' "$AIOA_GH_CLIENT_ID" | npx wrangler secret put GH_CLIENT_ID
          printf '%s' "$AIOA_GH_CLIENT_SECRET" | npx wrangler secret put GH_CLIENT_SECRET

      # 可选: 配置了 AZURE_TRANSLATOR_KEY secret 时同步微软翻译密钥 (区域资源另配 AZURE_TRANSLATOR_REGION)
      - name: 同步翻译密钥
        env:
          AIOA_TR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AIOA_TR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: |
          if [ -z "$AIOA_TR_KEY" ]; then
            echo "未配置 AZURE_TRANSLATOR_KEY secret, 跳过, 翻译接口返回 503"
            exit 0
          fi
          printf '%s' "$AIOA_TR_KEY" | npx wrangler secret put AZURE_TRANSLATOR_KEY
          if [ -n "$AIOA_TR_REGION" ]; then printf '%s' "$AIOA_TR_REGION" | npx wrangler secret put AZURE_TRANSLATOR_REGION; fi

      # 可选: 配置了 SETUP_CODE secret 时同步到 Worker, 首次 POST /api/v1/setup 建母号要用
      - name: 同步母号初始化口令
        env:
          AIOA_SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          if [ -z "$AIOA_SETUP_CODE" ]; then
            echo "未配置 SETUP_CODE secret, 跳过, 母号初始化不可用"
            exit 0
          fi
          printf '%s' "$AIOA_SETUP_CODE" | npx wrangler secret put SETUP_CODE
