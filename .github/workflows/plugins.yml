name: plugins

# 插件市场 CI: 清单校验, 命名空间, 静态冲突检测, 每日请求估算, 按端兼容 (#156); 报告与 "插件 × 端" 矩阵写进本次运行的摘要
on:
  pull_request:
    paths: ["plugins/**", "protocol/**", "tools/check-plugins.ts", "tools/plugin-index.ts", "tools/client-builds.ts"]
  push:
    branches: [main]
    paths: ["plugins/**", "protocol/**", "tools/check-plugins.ts", "tools/plugin-index.ts", "tools/client-builds.ts"]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 改动的插件目录
        if: github.event_name == 'pull_request'
        run: |
          dirs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- plugins | awk -F/ 'NF>2{print $2}' | sort -u | paste -sd, -)
          echo "CHANGED=$dirs" >> "$GITHUB_ENV"
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> "$GITHUB_ENV"
      - name: 升版本检查的基线
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then echo "BASE=${{ github.event.before }}" >> "$GITHUB_ENV"; fi
      # 构建号是否发布过: 安卓用 git ls-remote 查 android-N 标签, Web 用 gh 查 deploy.yml 在 main 上成功的运行号
      - run: npm run check:plugins
        env:
          GH_TOKEN: ${{ github.token }}
