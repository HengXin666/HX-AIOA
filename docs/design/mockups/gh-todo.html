<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HX-AIOA GitHub 授权插件与待办关联 设计稿</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#16181d;--sub:#6b7280;--faint:#9ca3af;--line:#e8e9ec;--accent:#2f6bff;--accent-soft:#e8efff;--ok:#12a150;--ok-soft:#e3f6ea;--warn:#d97706;--warn-soft:#fdf1dc;--bad:#dc2626;--bad-soft:#fde8e8;--done:#8250df;--done-soft:#f0e8fd;--chip:#f0f1f3}
.dark{--bg:#0f1115;--card:#181b21;--text:#eceef2;--sub:#9aa1ad;--faint:#6b7280;--line:#262a31;--accent:#5b8cff;--accent-soft:#1d2740;--ok:#3ccf7a;--ok-soft:#163023;--warn:#f0a43a;--warn-soft:#33270f;--bad:#f26464;--bad-soft:#3a1717;--done:#b392f0;--done-soft:#2a2140;--chip:#22262d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans",system-ui,sans-serif;background:#dfe2e7;color:var(--text);-webkit-font-smoothing:antialiased}
body.dark{background:#000}
svg.i{width:18px;height:18px;flex:none;vertical-align:middle}
svg.s{width:14px;height:14px}
.top{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #d4d7dd;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;white-space:nowrap}
.dark .top{background:rgba(20,22,26,.92);border-color:#2a2e35}
.top button{border:0;background:#eceef1;color:#333;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.dark .top button{background:#2a2e35;color:#ddd}
.top button.on{background:#2f6bff;color:#fff}
.stage{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:24px 12px 60px}
.wrap{display:flex;flex-direction:column;align-items:center}
.phone{width:390px;height:800px;background:var(--bg);border-radius:36px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #1b1d22,0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.cap{width:390px;text-align:center;font-size:13px;color:#555;margin-top:18px;line-height:1.5}
.dark .cap{color:#aaa}
@media (max-width:600px){.stage{padding:0;gap:0}.phone{width:100vw;height:calc(100vh - 49px);border-radius:0;box-shadow:none}.cap{display:none}.wrap{display:none}.wrap.show{display:flex}}
@media (min-width:601px){.wrap{display:flex!important}}
.status{height:30px;flex:none;display:flex;align-items:center;padding:0 22px;font-size:13px;font-weight:600}
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:4px 12px 10px}
.bar h1{font-size:18px;font-weight:700;flex:1}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.scroll{flex:1;overflow-y:auto;padding:0 14px 24px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.sec{font-size:12px;color:var(--faint);margin:14px 4px 6px}
.row{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.gh{background:#24292f;color:#fff}
.td{background:var(--accent-soft);color:var(--accent)}
.name{font-size:16px;font-weight:600}
.meta{font-size:12px;color:var(--sub);margin-top:2px}
.desc{font-size:13px;color:var(--sub);line-height:1.55;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--sub);font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--done-soft);color:var(--done)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;margin-top:12px}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.dep{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:13px}
.dep b{font-weight:600}
.code{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:700;letter-spacing:4px;text-align:center;padding:18px 0 6px}
.steps{font-size:13px;color:var(--sub);line-height:1.9;counter-reset:s}
.steps div{display:flex;gap:8px}
.steps div::before{counter-increment:s;content:counter(s);width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:4px}
.wait{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--sub);margin-top:12px}
.spin{animation:sp 1.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.note{display:flex;gap:8px;font-size:12px;color:var(--sub);line-height:1.6;background:var(--ok-soft);border-radius:12px;padding:10px 12px}
.note svg{color:var(--ok);margin-top:2px}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0;padding-top:2px}
.li .grow{flex:1;min-width:0}
.li .sm{font-size:12px;color:var(--faint);margin-top:2px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.log{font-size:13px;line-height:1.5}
.log .t{font-size:11px;color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px}
.chip{flex:none;padding:5px 12px;border-radius:14px;background:var(--card);font-size:13px;color:var(--sub)}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.todo{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.box svg{width:14px;height:14px}
.todo .tt{font-size:15px;line-height:1.4}
.todo.dn .tt{color:var(--faint);text-decoration:line-through}
.todo .ln{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--faint)}
.p1{color:var(--bad)}.p2{color:var(--warn)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.pane{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:8px 16px 26px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.field{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.field .k{color:var(--faint);font-size:12px;width:52px;flex:none}
.bubble{background:var(--card);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;max-width:300px}
.msg{display:flex;gap:8px;margin-bottom:12px}
.sys{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--sub);background:var(--chip);border-radius:10px;padding:6px 10px;margin:6px auto 12px;width:fit-content;max-width:330px}
</style>
</head>
<body>

4 17.592 24 12.297c0-6.627-5.373-12-12-12"/></g></symbol><symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /> <path d="M12 7v5l4 2" /></symbol><symbol id="i-key-round" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /> <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /></symbol><symbol id="i-link-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2" /> <path d="M15 7h2a5 5 0 1 1 0 10h-2" /> <line x1="8" x2="16" y1="12" y2="12" /></symbol><symbol id="i-list-checks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" /> <path d="M13 12h8" /> <path d="M13 19h8" /> <path d="m3 17 2 2 4-4" /> <path d="m3 7 2 2 4-4" /></symbol><symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /> <path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol><symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /> <path d="M12 5v14" /></symbol><symbol id="i-puzzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z" /></symbol><symbol id="i-refresh-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></symbol><symbol id="i-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /> <path d="m9 12 2 2 4-4" /></symbol><symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <path d="M16 3.128a4 4 0 0 1 0 7.744" /> <path d="M22 21v-2a4 4 0 0 0-3-3.87" /> <circle cx="9" cy="7" r="4" /></symbol></svg>
<div class="top" id="top">
  <button class="on" data-i="0">插件市场</button>
  <button data-i="1">授权 GitHub</button>
  <button data-i="2">GitHub 授权设置</button>
  <button data-i="3">待办 + issue</button>
  <button data-i="4">待办详情</button>
  <button data-i="5">群里的记录</button>
  <button id="dk">深色</button>
</div>
<div class="stage" id="stage"></div>
<script>
const I = (n, c = "i") => `<svg class="${c}"><use href="#i-${n}"/></svg>`;
const st = `<div class="status">20:30</div>`;
const bar = (t, back = true, right = "") => `<div class="bar">${back ? `<div class="ic">${I("chevron-left")}</div>` : ""}<h1>${t}</h1>${right}</div>`;
const S = [];

// 1 插件市场: 两个插件, 依赖关系
S.push([`${st}${bar("插件市场", false)}<div class="scroll">
<div class="card"><div class="row"><div class="logo gh">${I("github")}</div><div style="flex:1"><div class="name">GitHub 授权</div><div class="meta">基础插件 · 1.0.0 · 不建群</div></div><span class="pill ok">${I("circle-check-big","i s")}已授权</span></div>
<div class="desc">你在手机上授权一次, 令牌只存在服务端。其他插件和你允许的 Agent 通过服务端代办 issue 操作, 拿不到令牌本身。</div>
<div class="pills"><span class="pill">Issues 读写</span><span class="pill">2 个仓库</span><span class="pill">1 个 Agent 可用</span></div></div>
<div class="card"><div class="row"><div class="logo td">${I("list-checks")}</div><div style="flex:1"><div class="name">点子待办</div><div class="meta">1.4.0 → 1.5.0 可更新</div></div><span class="pill acc">${I("refresh-cw","i s")}更新</span></div>
<div class="desc">新: 待办显示创建日期; 可关联 GitHub issue, issue 关掉时待办自动完成; 整理员可以把待办直接建成 issue。</div>
<div class="dep">${I("puzzle")}<div style="flex:1">可选依赖 <b>GitHub 授权</b><div class="meta">没装也能用, 只是没有 issue 关联</div></div><span class="pill ok">已满足</span></div></div>
</div>`, "插件市场: GitHub 授权是基础插件 (不建群, 不带 Agent); 点子待办声明可选依赖, 满足时显示 issue 相关功能。"]);

// 2 授权流程: device flow
S.push([`${st}${bar("授权 GitHub")}<div class="scroll">
<div class="card"><div class="row"><div class="logo gh">${I("github")}</div><div><div class="name">在 GitHub 上输入这个码</div><div class="meta">15 分钟内有效</div></div></div>
<div class="code">WDJB-MJHT</div>
<div class="btn">${I("copy")}复制并打开 github.com/login/device</div>
<div class="wait">${I("refresh-cw","i s spin")}等你在 GitHub 上点 "Authorize"...</div></div>
<div class="card"><div class="steps"><div>点上面的按钮, 码已经复制好</div><div>GitHub 上粘贴, 选允许访问的仓库</div><div>回到这里, 自动完成</div></div></div>
<div class="note">${I("shield-check")}<div>令牌加密存在你的服务端, 不下发给手机和任何 Agent。随时可以在 GitHub 或这里撤销。</div></div>
</div>`, "授权: 走 GitHub 设备码流程, 手机上不用输密码; 服务端轮询结果, 授权完自动跳到设置页。"]);

// 3 设置页
S.push([`${st}${bar("GitHub 授权")}<div class="scroll">
<div class="card"><div class="row"><div class="av" style="background:#24292f">HX</div><div style="flex:1"><div class="name">HengXin666</div><div class="meta">11-25 授权 · 令牌 7 小时后自动续期</div></div><span class="pill ok">正常</span></div></div>
<div class="sec">允许操作的仓库</div>
<div class="card">
<div class="li"><div class="grow">HengXin666/HX-AIOA<div class="sm">Issues 读写</div></div><div class="sw on"></div></div>
<div class="li"><div class="grow">HengXin666/HX-CF-Drive<div class="sm">Issues 读写</div></div><div class="sw on"></div></div>
<div class="li"><div class="grow">HengXin666/HXLoLi<div class="sm">GitHub 上没给这个仓库授权</div></div><span class="pill">去 GitHub 加</span></div></div>
<div class="sec">能用它的 Agent</div>
<div class="card">

  document.querySelectorAll(".top button[data-i]").forEach((x) => x.classList.toggle("on", x === b));
