<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HX-AIOA 邮件与推送 设计稿</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#16181d;--sub:#6b7280;--faint:#9ca3af;--line:#e8e9ec;--accent:#2f6bff;--accent-soft:#e8efff;--ok:#12a150;--ok-soft:#e3f6ea;--warn:#d97706;--warn-soft:#fdf1dc;--bad:#dc2626;--bad-soft:#fde8e8;--chip:#f0f1f3}
.dark{--bg:#0f1115;--card:#181b21;--text:#eceef2;--sub:#9aa1ad;--faint:#6b7280;--line:#262a31;--accent:#5b8cff;--accent-soft:#1d2740;--ok:#3ccf7a;--ok-soft:#163023;--warn:#f0a43a;--warn-soft:#33270f;--bad:#f26464;--bad-soft:#3a1717;--chip:#22262d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans",system-ui,sans-serif;background:#dfe2e7;color:var(--text);-webkit-font-smoothing:antialiased}
body.dark{background:#000}
.top{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #d4d7dd;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;white-space:nowrap}
.dark .top{background:rgba(20,22,26,.92);border-color:#2a2e35}
.top button{border:0;background:#eceef1;color:#333;border-radius:16px;padding:6px 12px;font-size:13px}
.dark .top button{background:#2a2e35;color:#ddd}
.top button.on{background:#2f6bff;color:#fff}
.stage{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:24px 12px 60px}
.phone{width:390px;height:800px;background:var(--bg);border-radius:36px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #1b1d22,0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.cap{width:390px;text-align:center;font-size:13px;color:#555;margin-top:18px}
.dark .cap{color:#aaa}
.wrap{display:flex;flex-direction:column;align-items:center}
@media (max-width:600px){.stage{padding:0;gap:0}.phone{width:100vw;height:calc(100vh - 49px);border-radius:0;box-shadow:none}.cap{display:none}.wrap{display:none}.wrap.show{display:flex}}
@media (min-width:601px){.wrap{display:flex!important}}
.status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 10px}
.bar h1{font-size:20px;font-weight:700;flex:1;display:flex;align-items:center;gap:6px}
.bar h1 small{font-size:13px;color:var(--sub);font-weight:400}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--sub);font-size:18px}
.scroll{flex:1;overflow-y:auto}
.search{margin:0 14px 8px;background:var(--chip);border-radius:10px;padding:8px 12px;color:var(--faint);font-size:14px}
.chips{display:flex;gap:8px;padding:2px 14px 10px;overflow-x:auto}
.chip{flex:none;padding:5px 12px;border-radius:14px;background:var(--chip);font-size:13px;color:var(--sub)}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip b{font-weight:400;opacity:.7;margin-left:3px}
.day{padding:12px 16px 6px;font-size:12px;color:var(--faint)}
.list{background:var(--card)}
.row{display:flex;gap:12px;padding:12px 16px;position:relative}
.row+.row::before{content:"";position:absolute;left:72px;right:0;top:0;border-top:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:50%;flex:none;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-weight:700;color:#fff;font-size:18px;position:relative}
.av img{width:28px;height:28px}
.av.sq{border-radius:12px}
.dot{position:absolute;left:5px;top:28px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.body{flex:1;min-width:0}
.l1{display:flex;align-items:center;gap:6px}
.l1 .who{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .who,.unread .subj{font-weight:700}
.l1 .t{font-size:12px;color:var(--faint);flex:none}
.cnt{font-size:11px;color:var(--sub);background:var(--chip);border-radius:8px;padding:0 6px;flex:none}
.subj{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{font-size:13px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--sub)}
.tag.code{background:var(--accent-soft);color:var(--accent);font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.fab{position:absolute;right:18px;bottom:24px;background:var(--accent);color:#fff;border-radius:22px;padding:10px 16px;font-size:14px;box-shadow:0 6px 18px rgba(47,107,255,.35)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet .pane{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:8px 0 24px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.pane h3{font-size:13px;color:var(--faint);font-weight:400;padding:4px 18px 8px}
.acc{display:flex;align-items:center;gap:12px;padding:12px 18px}
.acc .n{flex:1}.acc .n div:first-child{font-size:15px}.acc .n div+div{font-size:12px;color:var(--faint);margin-top:2px}
.acc .k{font-size:13px;color:var(--sub)}
.acc.on .n div:first-child{color:var(--accent);font-weight:600}
.mav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.detail{background:var(--card);padding:16px}
.detail h2{font-size:20px;line-height:1.35;font-weight:700}
.from{display:flex;gap:12px;align-items:center;margin-top:16px}
.from .who{font-size:15px;font-weight:600}
.from .addr{font-size:12px;color:var(--faint)}
.tobox{margin-top:10px;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--sub);line-height:1.8}
.tobox b{color:var(--text);font-weight:500}
.mailhtml{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.6}
.btn{display:inline-block;margin-top:10px;background:#1f883d;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px}
.actions{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--card);padding:10px 0 18px;font-size:12px;color:var(--sub);flex:none}
.actions span{display:flex;flex-direction:column;align-items:center;gap:2px}
.actions i{font-style:normal;font-size:18px}
.chat{padding:8px 12px}
.today{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.today .hd{display:flex;align-items:center;gap:8px}
.today .hd b{font-size:16px;flex:1}
.today .hd span{font-size:12px;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--chip);border-radius:10px;padding:8px 0;text-align:center}
.stat div:first-child{font-size:18px;font-weight:700}
.stat div+div{font-size:11px;color:var(--sub)}
.srcs{display:flex;gap:6px;margin-top:10px;font-size:12px;color:var(--sub);align-items:center}
.srcs img{width:16px;height:16px;border-radius:4px}
.item{background:var(--card);border-radius:14px;padding:12px;margin-top:8px}
.ih{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.ih img{width:16px;height:16px;border-radius:4px}
.kind{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:600}
.k-deal{background:var(--warn-soft);color:var(--warn)}.k-oss{background:var(--accent-soft);color:var(--accent)}.k-news{background:var(--chip);color:var(--sub)}
.st{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:9px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.go{background:var(--accent-soft);color:var(--accent)}.st.q{background:var(--warn-soft);color:var(--warn)}.st.x{background:var(--chip);color:var(--faint);text-decoration:line-through}
.it{font-size:15px;font-weight:600;margin-top:6px;line-height:1.35}
.id{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.45}
.need{font-size:12px;margin-top:6px;background:var(--chip);border-radius:8px;padding:6px 8px;color:var(--sub)}
.need b{color:var(--text);font-weight:600}
.if{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:12px;color:var(--accent)}
.if .heat{color:var(--bad);margin-left:auto}
.if .m{color:var(--faint)}
.batch{text-align:center;font-size:11px;color:var(--faint);margin:14px 0 2px}
.used{opacity:.5}
.notif{margin:10px 12px;background:var(--card);border-radius:18px;padding:12px 14px;display:flex;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.notif .ap{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.notif b{font-size:14px}.notif p{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4}
.rep{background:var(--card);border-radius:16px;padding:16px;margin-top:8px}
.rep h2{font-size:18px}.rep .meta{font-size:12px;color:var(--faint);margin-top:4px}
.rep h4{font-size:14px;margin:14px 0 6px}
.rep li{font-size:13px;line-height:1.55;margin-left:18px;color:var(--text)}
.rep li a{color:var(--accent);text-decoration:none;font-size:12px}
.ref{display:inline-block;font-size:11px;background:var(--chip);color:var(--sub);border-radius:4px;padding:0 5px;margin-left:4px}
.tabs2{display:flex;gap:20px;padding:0 16px 8px;font-size:15px;color:var(--sub)}
.tabs2 .on{color:var(--text);font-weight:700;border-bottom:3px solid var(--accent);padding-bottom:4px}
.note{font-size:12px;color:var(--faint);padding:12px 16px 30px;line-height:1.6}
</style>
</head>

  if (x.batch) return `<div class="batch">${x.batch}</div>`;
  const [kl, kc] = KIND[x.k];
  return `<div class="item ${x.used ? "used" : ""}"><div class="ih"><img src="${fav(x.d)}"><span>${x.d}</span><span class="kind ${kc}">${kl}</span>${x.st ? `<span class="st ${x.st}">${x.stt}</span>` : ""}</div>
  <div class="it">${x.t}</div><div class="id">${x.s}</div>${x.need ? `<div class="need"><b>要做:</b> ${x.need}</div>` : ""}
  <div class="if">${x.links.map((l) => `<span>${l} ↗</span>`).join("")}${x.used ? '<span class="m">已用过</span>' : '<span class="m">☆ 收藏</span>'}${x.h ? `<span class="heat">🔥 ${x.h}</span>` : ""}</div></div>`;
}

const screens = [
  ["邮件列表", () => mailList(false)],
  ["切换账号", () => mailList(true)],
  ["邮件详情", mailDetail],
  ["福利群 今天", feed],
  ["合并通知", notif],
  ["周报", weekly],
];
const stage = document.getElementById("stage"), nav = document.getElementById("nav");
stage.innerHTML = screens.map(([n, f], i) => `<div class="wrap ${i === 0 ? "show" : ""}"><div class="phone">${f()}</div><div class="cap">${n}</div></div>`).join("");
nav.innerHTML = screens.map(([n], i) => `<button class="${i === 0 ? "on" : ""}" data-i="${i}">${n}</button>`).join("") + `<button id="dk">🌙 深色</button>`;
nav.onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "dk") { document.body.classList.toggle("dark"); document.querySelectorAll(".phone").forEach((p) => p.classList.toggle("dark")); return; }
  nav.querySelectorAll("button[data-i]").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".wrap").forEach((w, i) => w.classList.toggle("show", i == b.dataset.i));
  const w = document.querySelectorAll(".wrap")[b.dataset.i]; if (innerWidth > 600) w.scrollIntoView({ behavior: "smooth", inline: "center" });
};
