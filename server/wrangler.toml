name = "hx-aioa"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# install.sh 与探针脚本走静态资源 (不进 Worker, 不计请求额度); probe*.mjs 由部署时从 tools/ 复制
[assets]
directory = "./public"

# 免费计划只能使用 SQLite 存储的 Durable Object
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# 绑定自己的域名, workers.dev 在中国大陆多数无法直连
# 用 zone 内惯用的 route 模式 (与该 zone 其它子域一致), 不声明 custom_domain,
# 否则会与页面上已存在的 cdn.woa.qzz.io CNAME 争抢记录, 部署时报 100117
# 有 GITHUB_TOKEN 时每 30 分钟回填一次 GitHub 页面状态; 每天 03:00 (UTC+8) 清理临时邮箱超期邮件
[triggers]
crons = ["*/30 * * * *", "0 19 * * *"]

# 临时邮箱 (cloudflare_temp_email) 的库, 只用于定期清理超期邮件
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "temp-email-db"
database_id = "eeda9a60-a925-400e-8020-ad76c731aab1"

# 文件桶: 部署流程会先确保桶存在, 建不了就去掉这段, 文件接口返回 503
[[r2_buckets]]
binding = "FILES"
bucket_name = "hx-aioa-files"

[[routes]]
pattern = "aioa.woa.qzz.io/*"
zone_name = "woa.qzz.io"

# 以下用 wrangler secret put 设置, 不写进仓库:
# AUTH_TOKEN            必填, 客户端令牌 (母号全权限凭证)
# TOKEN_SECRET          多账号必填, 签发访问令牌并派生各接入 key 的 webhook 签名密钥
# SETUP_CODE            多账号必填, 一次性母号初始化口令 (POST /api/v1/setup)
# MIPUSH_APP_SECRET     可选, 小米推送 AppSecret
# MIPUSH_PACKAGE        可选, 安卓包名
# WXPUSHER_APP_TOKEN    可选, WxPusher 应用 token
# WXPUSHER_UID          可选, WxPusher 用户 UID
# GITHUB_TOKEN          可选, GitHub 只读 fine-grained token, 用于 GitHub 页面回填
