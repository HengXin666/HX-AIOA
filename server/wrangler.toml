name = "hx-aioa"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# install.sh 与探针脚本走静态资源 (不进 Worker, 不计请求额度); probe*.mjs 由部署时从 tools/ 复制
[assets]
directory = "./public"

# 免费计划只能使用 SQLite 存储的 Durable Object
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# 绑定自己的域名, workers.dev 在中国大陆多数无法直连
# 用 zone 内惯用的 route 模式 (与该 zone 其它子域一致), 不声明 custom_domain,
# 否则会与页面上已存在的 cdn.woa.qzz.io CNAME 争抢记录, 部署时报 100117
# 有 GITHUB_TOKEN 时每 30 分钟回填一次 GitHub 页面状态; 每天 03:00 (UTC+8) 清理临时邮箱超期邮件
[triggers]
crons = ["*/30 * * * *", "0 19 * * *"]

# 临时邮箱 (cloudflare_temp_email) 的库, 只用于定期清理超期邮件
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "temp-email-db"
database_id = "eeda9a60-a925-400e-8020-ad76c731aab1"

# 文件桶: 部署流程会先确保桶存在, 建不了就去掉这段, 文件接口返回 503
[[r2_buckets]]
binding = "FILES"
bucket_name = "hx-aioa-files"

# HX-CF-Drive (字节存 TG): 同账号 Service Binding, 不经过公网和 WAF; CFD_ORIGIN 是 Drive 的公网地址, 用来生成客户端可访问的直链
# 还要用 wrangler secret put CFD_TOKEN 配 Drive 后台建的受限令牌 (根目录 /aioa, read+write); 三项缺一就当没接入, 存储设置里选不了 cfd
[[services]]
binding = "DRIVE"
service = "hx-cf-drive"

[vars]
CFD_ORIGIN = "https://cfdb.woa.qzz.io"

[[routes]]
pattern = "aioa.woa.qzz.io/*"
zone_name = "woa.qzz.io"

# 运行时密钥用 wrangler secret put 设置 (或由部署从仓库 secret 同步), 不写进仓库。
# 全部变量, 哪些必填, 哪些是插件带的, 见 docs/deploy/env.md; 增删变量要同步改那张表。
